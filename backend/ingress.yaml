apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taiwanfrp-backend
  namespace: taiwanfrp-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - backend.taiwanfrp.internal
  rules:
  - host: backend.taiwanfrp.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taiwanfrp-backend-svc
            port:
              number: 80
