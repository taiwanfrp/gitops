apiVersion: apps/v1
kind: Deployment
metadata:
  name: taiwanfrp-backend
  namespace: taiwanfrp-ns
spec:
  selector:
    matchLabels:
      app: taiwanfrp-backend
  template:
    metadata:
      labels:
        app: taiwanfrp-backend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: taiwanfrp-backend
      containers:
      - name: taiwanfrp-backend
        image: ghcr.io/taiwanfrp/backend:021f3c8
        ports:
        - containerPort: 8000
        args:
        - "fastapi"
        - "run"
        - "--host="
        - "--port=8000"
        - "--proxy-headers"
        - "--forwarded-allow-ips=$(FORWARDED_ALLOW_IPS)"

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"

        envFrom:
        - configMapRef:
            name: taiwanfrp-backend-config
        - secretRef:
            name: taiwanfrp-backend-secret

      imagePullSecrets:
      - name: ghcr-creds
